# Standalone zip deploy for Azure Web App - image-repo-app
# Adapted from the proven Next.js standalone workflow (publish-profile auth
# preserved from this repo's existing App Service wiring).

name: Build and deploy Node.js app to Azure Web App - image-repo-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: image-repo-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies and build
        env:
          NEXT_PUBLIC_FUNCTIONS_BASE_URL: ${{ vars.NEXT_PUBLIC_FUNCTIONS_BASE_URL }}
        run: |
          npm ci
          echo "NEXT_PUBLIC_FUNCTIONS_BASE_URL=${NEXT_PUBLIC_FUNCTIONS_BASE_URL}"
          npm run build
          npm run test --if-present

      - name: Verify Next.js standalone output
        run: |
          test -f .next/standalone/server.js
          test -f .next/standalone/package.json
          test -d .next/static

      - name: Prepare standalone runtime assets
        run: |
          mkdir -p .next/standalone/.next

          rm -rf .next/standalone/.next/static
          cp -r .next/static .next/standalone/.next/static

          if [ -d "public" ]; then
            rm -rf .next/standalone/public
            cp -r public .next/standalone/public
          fi

      - name: Set standalone start script
        run: |
          cp scripts/azure-start.js .next/standalone/azure-start.js
          node -e "
            const fs = require('fs');
            const path = '.next/standalone/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.scripts = { ...(pkg.scripts || {}), start: 'node azure-start.js' };
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          "

      - name: Create deployment package
        run: |
          cd .next/standalone
          zip -r ../../release.zip .

      - name: Verify final deployment package
        run: |
          rm -rf /tmp/image-repo-app-release
          mkdir -p /tmp/image-repo-app-release
          unzip -q release.zip -d /tmp/image-repo-app-release

          test -f /tmp/image-repo-app-release/server.js
          test -f /tmp/image-repo-app-release/azure-start.js
          test -f /tmp/image-repo-app-release/package.json

          node -e "
            const pkg = require('/tmp/image-repo-app-release/package.json');
            if (pkg.scripts?.start !== 'node azure-start.js') {
              console.error('Unexpected start script:', pkg.scripts?.start);
              process.exit(1);
            }
            console.log('Verified startup command:', pkg.scripts.start);
          "

      - name: Validate publish profile secret
        run: |
          if [ -z "${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E7D40AEE6FE14BEEAB9183815729A66D }}" ]; then
            echo "Required publish-profile secret is missing."
            exit 1
          fi

      # App Insights / diagnostic-server harden settings (same intent as lang-app).
      # This workflow uses publish-profile auth (not OIDC), so az CLI login is
      # unavailable here — set these in App Service Configuration (or add OIDC later):
      #   ApplicationInsightsAgent_EXTENSION_VERSION=disabled
      #   APPINSIGHTS_ENABLED=false
      #   WEBSITE_USE_DIAGNOSTIC_SERVER=false
      # Resource group (portal): imageRepoResources — app name: image-repo-app
      # Startup Command: node azure-start.js
      # SCM_DO_BUILD_DURING_DEPLOYMENT: false (standalone zip is self-contained)

      - name: Deploy to Azure Web App - attempt 1
        id: deploy-to-webapp-attempt-1
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: "image-repo-app"
          slot-name: "Production"
          package: "release.zip"
          clean: true
          restart: true
          startup-command: "node azure-start.js"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E7D40AEE6FE14BEEAB9183815729A66D }}

      - name: Wait before retry if deployment failed
        if: steps.deploy-to-webapp-attempt-1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to Azure Web App - attempt 2
        if: steps.deploy-to-webapp-attempt-1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: "image-repo-app"
          slot-name: "Production"
          package: "release.zip"
          clean: true
          restart: true
          startup-command: "node azure-start.js"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E7D40AEE6FE14BEEAB9183815729A66D }}
